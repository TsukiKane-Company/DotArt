<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ドット絵メーカー by 月兼ホッパー</title><link rel="stylesheet" href="style.css"><script src="tsuki-loader.js"></script></head><body>
<header><h1>ドット絵メーカー <small>by 月兼ホッパー</small></h1><p class="lead">写真をドット絵に変換したり、白紙のマス目に描いたりできるよ。処理はブラウザの中だけ。画像はどこにも送らない。</p></header>
<main>
<section id="left">
<div id="toolbar" role="toolbar" aria-label="お絵かき道具">
<button class="tool on" data-tool="pen" aria-pressed="true" title="ペン">✎ ペン</button><button class="tool" data-tool="eraser" aria-pressed="false" title="消しゴム">⌫ 消しゴム</button><button class="tool" data-tool="fill" aria-pressed="false" title="塗りつぶし">▧ 塗りつぶし</button><button class="tool" data-tool="pick" aria-pressed="false" title="スポイト">◉ スポイト</button>
<span class="sep"></span><button id="undo" disabled title="元に戻す（Ctrl+Z）">↶ 元に戻す</button><button id="redo" disabled title="やり直す（Ctrl+Shift+Z）">↷ やり直す</button><button id="clear" disabled title="全部消す">全消し</button></div>
<div id="stage" tabindex="0"><input type="file" id="file" accept="image/*" hidden>
<label id="dropText" for="file">ここに画像をドロップ／クリックして選択／Ctrl+V で貼り付け<br><small>白紙から描くときは「白紙から描く」を押してね</small></label>
<canvas id="preview" hidden aria-label="ドット絵（描けるよ）"></canvas><canvas id="chart" hidden aria-label="アイロンビーズ図面"></canvas></div>
<div id="colorRow"><span>いまの色：</span><span id="cur" class="chip big" title="いまの色"></span><ul id="chips" aria-label="パレットの色（押して選ぶ）"></ul><label class="custom" title="好きな色を追加">＋<input type="color" id="custom" value="#BBF701" aria-label="好きな色"></label></div>
</section>
<section id="panel">
<div class="ctrl"><button id="openBtn">画像を読み込む</button><span class="or">または</span><select id="blankSize" aria-label="白紙のサイズ"><option value="photo" id="photoOpt" disabled hidden>画像から</option><option value="16">16×16</option><option value="32" selected>32×32</option><option value="48">48×48</option><option value="64">64×64</option></select><button id="blankBtn">白紙から描く</button></div>
<div class="ctrl"><label for="pal">パレット：</label><select id="pal">
<option value="tsuki">月兼</option><option value="gb">ゲームボーイ風（緑 4 色）</option><option value="term">黒緑ターミナル</option><option value="auto">自動（元画像から）</option></select></div>
<fieldset id="photoSet"><legend>写真の変換</legend>
<div class="ctrl"><label for="grid">ドットの数（長い辺）：<b id="gridVal">32</b></label><input type="range" id="grid" min="16" max="128" step="1" value="32"></div>
<div class="ctrl" id="kRow" hidden><label for="k">色の数：<b id="kVal">8</b></label><input type="range" id="k" min="2" max="16" value="8"></div>
<div class="ctrl"><label class="sw" for="dither"><input type="checkbox" id="dither" role="switch"><span class="knob" aria-hidden="true"></span>ディザリング（網かけ）</label></div>
<p class="hint">設定を変えると変換し直すよ（描いた分は「元に戻す」で戻せる）</p></fieldset>
<div class="ctrl"><label class="sw" for="lines"><input type="checkbox" id="lines" role="switch" checked><span class="knob" aria-hidden="true"></span>グリッド線（プレビューのみ）</label></div>
<div class="ctrl"><label class="sw" for="beads"><input type="checkbox" id="beads" role="switch"><span class="knob" aria-hidden="true"></span>アイロンビーズ図面</label></div>
<div id="beadBox" hidden><p id="beadSum"></p><ol id="beadList"></ol></div>
<div class="ctrl"><span>保存サイズ：</span><span class="seg" role="radiogroup">
<label><input type="radio" name="scale" value="1">1倍</label><label><input type="radio" name="scale" value="4">4倍</label><label><input type="radio" name="scale" value="8" checked>8倍</label><label><input type="radio" name="scale" value="max">最大</label></span></div>
<p id="sizeInfo"></p>
<div class="btns"><button id="save" disabled>PNG で保存</button><button id="saveChart" disabled>図面を PNG で保存</button></div>
<p id="toast" role="status"></p>
<div id="iosBox" hidden><p>画像を<b>長押し</b>して「“写真”に追加」または「画像を保存」を選んでね。</p><img id="iosImg" alt="保存用の画像"><div class="btns"><a id="iosOpen" class="btn" target="_blank" rel="noopener">新しいタブで開く</a><button id="iosClose">閉じる</button></div></div>
</section></main>
<footer>月兼重工｜TSUKIKANE HEAVY INDUSTRIES</footer>
<script src="app.js"></script></body></html>
